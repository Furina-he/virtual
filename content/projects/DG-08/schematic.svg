<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" role="img" aria-labelledby="title desc">
  <title id="title">DG-08 叠加定理线性与非线性切换原理图</title>
  <desc id="desc">mod-dc-circuit 上半部电路：K1 控制 U1 投入或短路置零，K2 控制 U2 投入或短路置零，K3 切换 D-C 支路在线性电阻 R5（330 Ω）与非线性二极管 VD1（1N4007）之间切换。</desc>
  <style>
    text { font-family: "Noto Sans SC Variable", sans-serif; fill: #18181b; font-size: 14.5px; }
    .wire { fill: none; stroke: #18181b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke: #18181b; stroke-width: 2; }
    .jack { fill: #ffffff; stroke: #18181b; stroke-width: 2; cursor: pointer; }
    .hi { fill: none; stroke: #2563eb; stroke-width: 2; }
    .small { font-size: 12.5px; fill: #52525b; }
    .center { text-anchor: middle; }
  </style>
  <rect width="820" height="490" fill="#ffffff"/>
  <text x="410" y="34" class="center" style="font-size: 20px; font-weight: 600">DG-08 叠加定理验证电路（K1/K2 置零 + K3 线性/非线性切换）</text>
  <text x="410" y="58" class="center small">mod-dc-circuit 上半部 · K1/K2: 1=接入电源, 0=短路置零 · K3: 0=R5 (330 Ω), 1=VD1 (1N4007)</text>

  <g class="wire">
    <path d="M120 135 H180 M240 135 H285 M315 135 H410 H475 M505 135 H560 M625 135 H700"/>
    <path d="M410 135 V180 M410 208 V245 M410 305 V355"/>
    <path d="M120 355 H225 M290 355 H410 H475"/>
    <path d="M475 355 V325 H510 M570 325 H620 V355 H700"/>
    <path d="M475 355 V392 H515 M565 392 H620 V355"/>
    <path d="M120 135 V210 M120 270 V355"/>
    <path d="M700 135 V210 M700 270 V355"/>
    <path d="M285 135 H315 M475 135 H505 M410 180 V208" stroke-dasharray="3 3"/>
  </g>

  <rect x="180" y="125" width="60" height="20" class="box"/>
  <rect x="560" y="125" width="65" height="20" class="box"/>
  <rect x="400" y="245" width="20" height="60" class="box"/>
  <rect x="225" y="345" width="65" height="20" class="box"/>
  <rect x="510" y="315" width="60" height="20" class="box"/>
  <path d="M525 382 L552 392 L525 402 Z M552 382 V402" class="box" style="stroke: #2563eb"/>
  <circle cx="120" cy="240" r="26" class="box"/>
  <circle cx="700" cy="240" r="26" class="box"/>

  <text x="210" y="114" class="center small">R1 510Ω</text>
  <text x="592" y="114" class="center small">R2 1kΩ</text>
  <text x="454" y="280" class="center small">R3 510Ω</text>
  <text x="258" y="384" class="center small">R4 510Ω</text>
  <text x="540" y="306" class="center small">K3=0: R5 330Ω</text>
  <text x="540" y="422" class="center small" style="fill: #2563eb">K3=1: VD1 1N4007（非线性）</text>
  <text x="120" y="235" class="center">+</text>
  <text x="120" y="256" class="center">−</text>
  <text x="700" y="235" class="center">+</text>
  <text x="700" y="256" class="center">−</text>
  <text x="64" y="236" class="center">U1 (6V)</text>
