  <circle id="JACK_KH_F" data-jack="dc1.KH_F" cx="120" cy="135" r="4" class="jack"/>
  <circle id="JACK_KH_A" data-jack="dc1.KH_A" cx="410" cy="135" r="4" class="jack"/>
  <circle id="JACK_KH_B" data-jack="dc1.KH_B" cx="700" cy="135" r="4" class="jack"/>
  <circle id="JACK_KH_E" data-jack="dc1.KH_E" cx="120" cy="355" r="4" class="jack"/>
