<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">SD-18 8 线时分复用数据传输电路原理图（74LS161 + 74LS151 + 74LS138）</text>
  <rect x="40" y="70" width="200" height="140" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">发送端 74LS151</text>
  <text x="140" y="128" text-anchor="middle" font-size="12" fill="#334155">D0~D7 并行输入</text>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#475569">8 选 1 并转串 → TX_Y</text>
  <rect x="570" y="70" width="210" height="140" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="675" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">接收端 74LS138 + 74LS04</text>
  <text x="675" y="128" text-anchor="middle" font-size="12" fill="#334155">RX_DIN → G1 选通</text>
  <text x="675" y="156" text-anchor="middle" font-size="11" fill="#475569">1 分 8 串转并 → RX0~RX7</text>
  <rect x="295" y="255" width="225" height="110" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="407" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">同步地址计数器 74LS161</text>
  <text x="407" y="312" text-anchor="middle" font-size="12" fill="#334155">CP_MAN / CLK_OUT → CNT_CP</text>
  <text x="407" y="338" text-anchor="middle" font-size="11" fill="#475569">输出同步地址 A0、A1、A2 (0~7)</text>
  <line x1="240" y1="140" x2="570" y2="140" stroke="#dc2626" stroke-width="2.5"/>
  <text x="405" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">单根串行数据总线 (TX_Y → RX_DIN)</text>
  <polyline points="350,255 350,230 140,230 140,210" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <polyline points="465,255 465,230 675,230 675,210" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="240" cy="140" r="4" fill="#dc2626" data-jack="mux1.TX_Y"/>
  <circle cx="570" cy="140" r="4" fill="#dc2626" data-jack="mux1.RX_DIN"/>
  <circle cx="350" cy="255" r="4" fill="#d97706" data-jack="mux1.CNT_A0"/>
  <circle cx="465" cy="255" r="4" fill="#d97706" data-jack="mux1.CNT_A2"/>
  <text x="410" y="408" text-anchor="middle" font-size="12" fill="#64748b">+5V→VCC/CNT_CLR，GND→GND，CNT_A0~A2 同步接 TX_A0~A2 与 RX_A0~A2，TX_Y→RX_DIN</text>
</svg>
