  <g data-jack-id="R5_2"><title>timer1.R5_2：原调制输出端，连接 T2_CV 与 T2_CC_1</title><circle cx="1060" cy="1030" r="5" class="jack"/><text x="1035" y="1078" class="jack-label">R5_2</text></g>
