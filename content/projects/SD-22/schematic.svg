    <path d="M430 140 V280 M1110 140 V280 M430 590 V760 M1110 590 V760"/>
    <path d="M380 140 V280 M1060 140 V280"/>
  </g>
  <text x="94" y="124">+5 V：CH1P</text>
  <text x="94" y="793">GND：CH1N</text>
