  <text x="925" y="917" class="small">R5_2 接 IC2 CV / C4</text>
  <text x="925" y="942" class="small">C4 保留在 CV 与 GND 之间</text>
  <text x="925" y="967" class="small">跨 GND 处无连接；缓冲不驱动扬声器</text>

  <path d="M65 1206 H1435" class="wire"/>
  <text x="70" y="1238" class="small">原型诊断（非本次操作）：TH 直接经 R5 接 CV 会使 C1 平衡约 3.061 V &gt; 下阈值 1.667 V，低频停振；历史证据保留。</text>
  <text x="70" y="1265" class="small">批准缓冲保留真实 CV 分压，VCV ≈ 2.5 + 0.25 VBUF，约 2.917–3.333 V；原 36 孔 / RC / NE555 模型不改。</text>
  <text x="70" y="1292" class="small">TLV9001_EST 为独立 M0 估计，非 TI SPICE / 最坏条件保证；有限输出、1 mA 模型限流等不能当作厂商额定值。</text>
  <text x="70" y="1321" class="small">测量：低频 0.2 s/div；高频 / 平台 0.2 ms/div；frequency/period 至少两完整周期；CV 均值与载频各保留真实窗口。</text>
  <text x="70" y="1348" class="small">声音由同一真实仿真差分采样提取基频 / 包络；正式实时性能与全流程录屏须实际验收，不凭静态图、三点或手填判完成。</text>
</svg>
