  <g data-jack-id="C5_N"><title>C5_N：输出隔直电解电容负端</title><circle cx="1310" cy="558" r="5" class="jack"/><text x="1325" y="563" class="jack-label">C5_N</text></g>
  <g data-jack-id="SPK_P"><title>SPK_P：扬声器正端，经 C5 隔直</title><circle cx="1310" cy="618" r="5" class="jack"/><text x="1325" y="623" class="jack-label">SPK_P</text></g>
  <g data-jack-id="SPK_N"><title>SPK_N：扬声器负端，接 GND1</title><circle cx="1310" cy="733" r="5" class="jack"/><text x="1325" y="738" class="jack-label">SPK_N</text></g>

