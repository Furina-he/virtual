  <text x="70" y="830" class="heading">调制线二选一：由学员断电改线，不是板内开关</text>
  <g class="choice">
    <path d="M630 370 H690 V880 H600 L630 900"/>
    <path d="M170 490 H110 V930 H600 L630 900"/>
  </g>
  <text x="185" y="876" class="small">救护车：T1_OUT → R5_1（双音交替）</text>
  <text x="185" y="923" class="small">消防车原型：T1_TH → R5_1（加载停振，待缓冲修订）</text>
  <g class="wire">
    <path d="M630 900 H660 M740 900 H790 H1255 V778 Q1270 760 1255 742 V650 H1235"/>
  </g>
  <rect x="660" y="888" width="80" height="24" class="component"/>
  <text x="700" y="872" class="center">R5 · 10 kΩ</text>
  <g data-jack-id="R5_1"><title>R5_1：调制输入端，OUT 与 TH 两种候选线互斥</title><circle cx="630" cy="900" r="5" class="jack"/><text x="614" y="934" class="jack-label">R5_1</text></g>
  <g data-jack-id="R5_2"><title>R5_2：调制输出端，连接 T2_CV 与 T2_CC_1</title><circle cx="790" cy="900" r="5" class="jack"/><text x="774" y="934" class="jack-label">R5_2</text></g>
  <circle cx="1235" cy="650" r="3" class="node"/>
  <text x="835" y="883" class="small">R5_2 接 IC2 CV；跨 GND 处无连接</text>

  <path d="M65 978 H1435" class="wire"/>
  <text x="70" y="1010" class="small">原型消防车缺陷：NE555 CV 等效为 3.333 V / 3.333 kΩ，经 R5 上拉 C1；放电平衡约 3.061 V &gt; IC1 下阈值 1.667 V。</text>
  <text x="70" y="1037" class="small">不能把恒定载频当作渐变；高输入阻抗电压跟随缓冲尚待审批。电阻、电容、CV 输入阻抗和旧音频夹具参数不作暗改。</text>
  <text x="70" y="1074" class="small">测量：低频约 0.2 s/div；高频约 0.2 ms/div；CV 用 DC 耦合；扬声器测 SPK_P−SPK_N。真实波形与声音均来自本次仿真。</text>
  <text x="70" y="1100" class="small">本图只定义电气连接。公共波形记录 / 分步骤拓扑 / 音频运行时未接通时，不能凭静态图或手填数据宣布实训完成。</text>
</svg>
