<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1130" role="img" aria-labelledby="title description">
  <title id="title">SD-22 双 NE555 救护车与消防车原型报警电路</title>
  <desc id="description">五伏供电。左侧低频 NE555 使用十千欧、百五十千欧和四点七微法定时；右侧音频 NE555 使用两个十千欧和四十七纳法定时。救护车把左侧 OUT 经十千欧调制电阻接到右侧 CV，消防车原型改用左侧 TH。后者因控制端加载停振，缓冲修订待审批。右侧 OUT 经一百微法隔直电容驱动八欧扬声器。所有三十六个插孔标有与实验板一致的编号；两条调制候选线互斥，不是板内开关。</desc>
  <metadata>Original code-native teaching schematic for mod-555-app, prototype section 5.4. Project-owned artwork. No copied panel, remote font, fixed waveform or prerecorded audio. Fire-prototype loading defect intentionally disclosed.</metadata>
  <style>
    text { font-family: "Noto Sans SC Variable", sans-serif; fill: black; font-size: 17px; }
    .wire { fill: none; stroke: black; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .component { fill: white; stroke: black; stroke-width: 2; }
    .jack { fill: white; stroke: black; stroke-width: 2; }
    .node { fill: black; }
    .choice { fill: none; stroke: dimgray; stroke-width: 2; stroke-dasharray: 7 6; }
    .small { font-size: 14px; fill: dimgray; }
    .jack-label { font-family: "JetBrains Mono Variable", monospace; font-size: 13px; }
    .pin-label { font-size: 15px; }
    .center { text-anchor: middle; }
    .heading { font-size: 22px; font-weight: 600; }
  </style>
  <rect width="1500" height="1130" fill="white"/>
  <text x="750" y="38" class="center heading">救护车 / 消防车声响报警电路：双 555 原型</text>
  <text x="750" y="68" class="center small">SD-22 · 5 V · 圆圈为插孔 · 电气原理图，不是面板布局 · 消防车原型需缓冲修订</text>
  <text x="390" y="107" class="center">IC1 低频振荡器：设计约 0.99 Hz</text>
  <text x="1060" y="107" class="center">IC2 音频振荡器：未调制约 1.02 kHz</text>

  <!-- The VCC/GND pins are the only copper connections inside the board. -->
