  <g data-jack-id="T2_DIS"><title>T2_DIS：IC2 第七脚放电</title><circle cx="965" cy="370" r="5" class="jack"/><text x="947" y="356" class="jack-label" text-anchor="end">T2_DIS</text></g>
  <g data-jack-id="T2_TH"><title>T2_TH：IC2 第六脚阈值</title><circle cx="965" cy="410" r="5" class="jack"/><text x="971" y="402" class="jack-label" text-anchor="end">T2_TH</text></g>
