<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1370" role="img" aria-labelledby="title description">
  <title id="title">SD-22 双 NE555 与独立 TLV9001 跟随器的两模式报警电路</title>
  <desc id="description">原三十六插孔五伏 555 板保持全部电阻电容。救护车 OUT 方波直接经十千欧 R5 调制 IC2 CV；消防车 TH 电容电压先经过已批准的独立 TLV9001IDBVR 高输入阻抗单位增益适配板，再经原 R5 调制 CV。适配板有 VCC、GND、IN、OUT 四孔，电源与原板同源同地，内部一百纳法去耦。两个模式的调制信号来源互斥；原 TH 直连 R5 的停振接法仅作诊断补充。输出经一百微法电容驱动八欧扬声器。模型为项目独立估计，正式实时声音尚待实际验收。</desc>
  <metadata>Original code-native teaching schematic for mod-555-app and the approved independent mod-voltage-follower. Prototype section 5.4 and docs/06. Project-owned artwork. No copied panel, remote font, fixed waveform or prerecorded audio. Original fire-prototype loading evidence is retained as a diagnosis, not an operational mode.</metadata>
