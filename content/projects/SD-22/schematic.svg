  <text x="1350" y="660">LS1</text><text x="1350" y="687" class="small">8 Ω / 0.5 W</text>

  <g data-jack-id="T1_RA_1"><title>T1_RA_1：RA1 电源端</title><circle cx="170" cy="164" r="5" class="jack"/><text x="195" y="174" class="jack-label">T1_RA_1</text></g>
  <g data-jack-id="T1_RA_2"><title>T1_RA_2：RA1 放电端</title><circle cx="170" cy="276" r="5" class="jack"/><text x="195" y="282" class="jack-label">T1_RA_2</text></g>
  <g data-jack-id="T1_RB_1"><title>T1_RB_1：RB1 放电端</title><circle cx="170" cy="326" r="5" class="jack"/><text x="193" y="332" class="jack-label">T1_RB_1</text></g>
  <g data-jack-id="T1_RB_2"><title>T1_RB_2：RB1 定时电容端</title><circle cx="170" cy="464" r="5" class="jack"/><text x="72" y="458" class="jack-label">T1_RB_2</text></g>
  <g data-jack-id="T1_DIS"><title>T1_DIS：IC1 第七脚放电</title><circle cx="285" cy="370" r="5" class="jack"/><text x="267" y="356" class="jack-label" text-anchor="end">T1_DIS</text></g>
  <g data-jack-id="T1_TH"><title>T1_TH：IC1 第六脚阈值，与 TR 和 C1 正端接在同一网络</title><circle cx="285" cy="410" r="5" class="jack"/><text x="291" y="402" class="jack-label" text-anchor="end">T1_TH</text></g>
