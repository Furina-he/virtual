  <g data-jack-id="GND1"><title>GND1：共用地插孔</title><circle cx="90" cy="760" r="5" class="jack"/><text x="42" y="746" class="jack-label">GND1</text></g>

  <rect x="330" y="280" width="170" height="310" class="component"/>
  <rect x="1010" y="280" width="170" height="310" class="component"/>
