    <text x="342" y="303">4 R</text><text x="489" y="303" text-anchor="end">8 VCC</text>
    <text x="1022" y="303">4 R</text><text x="1169" y="303" text-anchor="end">8 VCC</text>
    <text x="338" y="380">7 DIS</text><text x="338" y="415">6 TH</text><text x="338" y="455">2 TR</text>
    <text x="482" y="386" text-anchor="end">3 OUT</text>
