  <g data-jack-id="T2_CT_N"><title>T2_CT_N：C2 接地端；此电容无极性</title><circle cx="850" cy="724" r="5" class="jack"/><text x="740" y="729" class="jack-label">T2_CT_N</text></g>
  <g data-jack-id="T2_CC_1"><title>T2_CC_1：C4 接 CV 的一端</title><circle cx="1220" cy="650" r="5" class="jack"/><text x="1088" y="655" class="jack-label">T2_CC_1</text></g>
