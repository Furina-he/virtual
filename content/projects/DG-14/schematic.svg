<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="title desc">
  <title id="title">DG-14 RLC 串联谐振电路原理图</title>
  <desc id="desc">函数信号发生器驱动可切换电阻 Rs、10 mH 空心电感与 0.1 µF 电容串联谐振回路，用交流毫伏表测量电容端谐振电压 UC。</desc>
  <style>
    text { font-family: "Noto Sans SC Variable", sans-serif; fill: #18181b; font-size: 14px; }
    .wire { fill: none; stroke: #18181b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .meter { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 5 4; }
    .box { fill: #ffffff; stroke: #18181b; stroke-width: 2; }
    .jack { fill: #ffffff; stroke: #18181b; stroke-width: 2; cursor: pointer; }
    .small { font-size: 12.5px; fill: #52525b; }
    .center { text-anchor: middle; }
  </style>
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="34" class="center" style="font-size: 20px; font-weight: 600">DG-14 R、L、C 串联谐振电路</text>
  <text x="390" y="58" class="center small">mod-rlc-transient · Rs = 51 Ω / 150 Ω · L = 10 mH · C = 0.1 µF · f0 = 5032.9 Hz</text>

  <g class="wire">
    <path d="M100 120 H200 M270 120 H365 M445 120 H540 V195 M540 215 V300 H100 V245 M100 185 V120"/>
    <path d="M518 195 H562 M518 215 H562"/>
  </g>
  <g class="meter">
    <path d="M540 155 H655 V185 M655 225 V265 H540"/>
  </g>

  <circle cx="100" cy="215" r="28" class="box"/>
  <text x="100" y="221" class="center">~</text>
  <text x="52" y="212" class="center small">FG</text>
  <text x="52" y="230" class="center small">2 Vpp</text>

  <rect x="200" y="110" width="70" height="20" class="box"/>
  <text x="235" y="96" class="center small">Rs 51 / 150 Ω</text>

  <rect x="365" y="110" width="80" height="20" class="box"/>
  <text x="405" y="96" class="center small">L 10 mH</text>

  <text x="488" y="210" class="center small">C 0.1µF</text>

  <circle cx="655" cy="205" r="20" class="box" style="stroke: #2563eb"/>
  <text x="655" y="210" class="center" style="fill: #2563eb; font-weight: 600">mV</text>
  <text x="655" y="246" class="center small">测 U_C</text>

  <circle id="JACK_CH1" data-jack="generator1.CH1" cx="100" cy="155" r="4.5" class="jack"/>
  <circle id="JACK_GND" data-jack="generator1.GND" cx="100" cy="275" r="4.5" class="jack"/>
  <circle id="JACK_RS_1" data-jack="rlc1.RS_1" cx="175" cy="120" r="4.5" class="jack"/>
  <circle id="JACK_RS_2" data-jack="rlc1.RS_2" cx="295" cy="120" r="4.5" class="jack"/>
  <circle id="JACK_LS_1" data-jack="rlc1.LS_1" cx="345" cy="120" r="4.5" class="jack"/>
  <circle id="JACK_LS_2" data-jack="rlc1.LS_2" cx="465" cy="120" r="4.5" class="jack"/>
  <circle id="JACK_CS_1" data-jack="rlc1.CS_1" cx="540" cy="155" r="4.5" class="jack"/>
  <circle id="JACK_CS_2" data-jack="rlc1.CS_2" cx="540" cy="265" r="4.5" class="jack"/>

  <text x="175" y="144" class="center small">Rs1</text>
  <text x="295" y="144" class="center small">Rs2</text>
  <text x="345" y="144" class="center small">L1</text>
  <text x="465" y="144" class="center small">L2</text>
  <text x="562" y="152" class="small">C1</text>
  <text x="562" y="278" class="small">C2</text>

  <text x="390" y="356" class="center small">扫频 2.5 ~ 8.5 kHz 观察 f0 ≈ 5033 Hz 处 U_C 单峰放大；切换 Rs 51 Ω → 150 Ω 对比 Q 值。</text>
  <text x="390" y="384" class="center small">本项目自绘离线原理图 · 悬停或点击插孔与 3D 台面双向联动</text>
</svg>
