<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">MD-07 三极管放大电路故障排除原理图</title>
  <desc id="description">共射极单管放大电路排故原理图：含偏置电阻RB1/RB2/RW、三极管VT1(QVT1)、集电极电阻RC、发射极电阻RE、旁路电容CE及输入/输出耦合电容C1/C2。</desc>
  <metadata>Original code-native teaching schematic for MD-07 troubleshooting based on mod-analog-amp board.</metadata>
  <style>
    text { font-family: "Noto Sans SC Variable", sans-serif; fill: black; font-size: 14px; }
    .wire { fill: none; stroke: black; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .component,.jack { fill: white; stroke: black; stroke-width: 2; }
    .node { fill: black; }
    .small { font-size: 12px; fill: dimgray; }
    .center { text-anchor: middle; }
    .end { text-anchor: end; }
    .external { fill: none; stroke: steelblue; stroke-width: 2; stroke-dasharray: 7 5; }
  </style>
