  <text x="815" y="297" class="center small">接通才带载</text>
  <text x="450" y="579" class="center small">排故流程：观察现象 → 测量定位(UB/UC/UE/Uo) → 提交故障位号与类型 → 系统判定 → 断电更换修复 → 上电验证。</text>
