<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">MD-03 共射极单管放大器原理图</title>
  <desc id="description">Us经5.1千欧和10微法耦合到B。20千欧与0至100千欧偏置支路接12伏，B下方20千欧接地。NPN_3DG6_EST是beta约60的自建估计NPN模型。C经2.4千欧接VCC，E经1千欧接地，47微法经KCE旁路E电阻。C经10微法输出到Uo，独立RL插孔经2.4千欧接地，Uo与RL只通过学员外接短线相连。GND1和GND2内部共地。</desc>
  <metadata>Original code-native teaching schematic. Prototype section5.3 electrical values and jackIDs; no vendor art, trademark or relabeled S9013 model. M0 carrier/parameters require formal review.</metadata>
