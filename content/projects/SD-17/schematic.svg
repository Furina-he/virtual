<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">SD-17 声光控制节能路灯电路原理图（GL5528 + 驻极体 + CD4011 + 继电器）</text>
  <rect x="30" y="60" width="160" height="130" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">光控检测</text>
  <text x="110" y="112" text-anchor="middle" font-size="12" fill="#334155">20kΩ + GL5528</text>
  <text x="110" y="136" text-anchor="middle" font-size="11" fill="#475569">0 lx → H / 500 lx → L</text>
  <rect x="30" y="220" width="160" height="130" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">声控拾音</text>
  <text x="110" y="272" text-anchor="middle" font-size="12" fill="#334155">驻极体话筒 + 包络检波</text>
  <text x="110" y="296" text-anchor="middle" font-size="11" fill="#475569">拍手声 → MIC_OUT = H</text>
  <rect x="245" y="120" width="210" height="165" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CD4011 门控与延时</text>
  <text x="350" y="178" text-anchor="middle" font-size="12" fill="#334155">GATE = ~(LDR · MIC)</text>
  <text x="350" y="206" text-anchor="middle" font-size="12" fill="#334155">二极管快充 / 10µF·36kΩ 延时</text>
  <text x="350" y="236" text-anchor="middle" font-size="11" fill="#475569">双门整形输出 DRV_OUT</text>
  <rect x="515" y="120" width="265" height="165" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="647" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">继电器与 12 V 路灯</text>
  <text x="647" y="180" text-anchor="middle" font-size="12" fill="#334155">REL_IN → 5 V 电磁继电器</text>
  <text x="647" y="210" text-anchor="middle" font-size="12" fill="#334155">LAMP_V12(12V) → REL_NO → LAMP_IN</text>
  <text x="647" y="240" text-anchor="middle" font-size="11" fill="#475569">12 V / 0.1 A 路灯 → LAMP_GND</text>
  <line x1="190" y1="125" x2="245" y2="165" stroke="#0f172a" stroke-width="2"/>
  <line x1="190" y1="285" x2="245" y2="235" stroke="#0f172a" stroke-width="2"/>
  <line x1="455" y1="202" x2="515" y2="202" stroke="#0f172a" stroke-width="2"/>
  <circle cx="190" cy="125" r="4" fill="#2563eb" data-jack="stl1.LDR_OUT"/>
  <circle cx="190" cy="285" r="4" fill="#2563eb" data-jack="stl1.MIC_OUT"/>
  <circle cx="455" cy="202" r="4" fill="#16a34a" data-jack="stl1.DRV_OUT"/>
  <circle cx="515" cy="202" r="4" fill="#d97706" data-jack="stl1.REL_IN"/>
  <circle cx="647" cy="285" r="4" fill="#d97706" data-jack="stl1.LAMP_IN"/>
  <text x="410" y="410" text-anchor="middle" font-size="12" fill="#64748b">控制屏 +5V→VCC，CH1(+12V)→LAMP_V12，V5N/CH1N→GND/LAMP_GND，DRV_OUT→REL_IN，REL_NO→LAMP_IN</text>
</svg>
