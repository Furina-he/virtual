  <circle id="JACK_KH_I1B" data-jack="dc1.KH_I1B" cx="273" cy="170" r="4" class="jack"/>
  <circle id="JACK_KH_I2A" data-jack="dc1.KH_I2A" cx="429" cy="170" r="4" class="jack"/>
  <circle id="JACK_KH_I2B" data-jack="dc1.KH_I2B" cx="459" cy="170" r="4" class="jack"/>
  <circle id="JACK_KH_I3A" data-jack="dc1.KH_I3A" cx="390" cy="218" r="4" class="jack"/>
  <circle id="JACK_KH_I3B" data-jack="dc1.KH_I3B" cx="390" cy="244" r="4" class="jack"/>
  <text x="258" y="195" class="center small">I1 常闭插座</text>
  <text x="444" y="195" class="center small">I2 常闭插座</text>
  <text x="409" y="234" class="small">I3 常闭插座</text>

  <circle id="JACK_KH_U1P" data-jack="dc1.KH_U1P" cx="120" cy="230" r="4" class="jack"/>
  <circle id="JACK_KH_U1N" data-jack="dc1.KH_U1N" cx="120" cy="340" r="4" class="jack"/>
  <circle id="JACK_KH_U2P" data-jack="dc1.KH_U2P" cx="660" cy="230" r="4" class="jack"/>
  <circle id="JACK_KH_U2N" data-jack="dc1.KH_U2N" cx="660" cy="340" r="4" class="jack"/>
  <text x="69" y="237" class="small">U1+</text>
  <text x="69" y="347" class="small">U1−</text>
  <text x="680" y="237" class="small">U2+</text>
  <text x="680" y="347" class="small">U2−</text>

  <circle id="JACK_KH_F" data-jack="dc1.KH_F" cx="120" cy="170" r="3.5" class="node"/>
  <circle id="JACK_KH_A" data-jack="dc1.KH_A" cx="390" cy="170" r="3.5" class="node"/>
  <circle id="JACK_KH_B" data-jack="dc1.KH_B" cx="660" cy="170" r="3.5" class="node"/>
  <circle id="JACK_KH_E" data-jack="dc1.KH_E" cx="120" cy="390" r="3.5" class="node"/>
  <circle id="JACK_KH_D" data-jack="dc1.KH_D" cx="390" cy="390" r="3.5" class="node"/>
  <circle id="JACK_KH_C" data-jack="dc1.KH_C" cx="660" cy="390" r="3.5" class="node"/>
  <text x="120" y="152" class="center" style="font-weight: 600">F</text>
  <text x="390" y="152" class="center" style="font-weight: 600">A</text>
  <text x="660" y="152" class="center" style="font-weight: 600">B</text>
  <text x="108" y="416" style="font-weight: 600">E</text>
  <text x="385" y="416" style="font-weight: 600">D</text>
  <text x="655" y="416" style="font-weight: 600">C</text>

  <text x="410" y="486" class="center small">图示电流插座未插表时短接；两根表线均插入后，对应短接断开，串入表内阻。</text>
  <text x="410" y="510" class="center small">虚线仅表示回路方向，不是导线。省略铜箔与开关的微小导通电阻；参数见指导。</text>
  <text x="410" y="534" class="center small">本项目自绘 · 当前估计电路模型 · CH1−与 CH2−不得外部短接</text>
</svg>
