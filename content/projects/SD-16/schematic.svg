<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">SD-16 集成施密特触发器原理图（74LS14 / CD40106 波形整形与 RC 多谐振荡）</text>
  <rect x="45" y="75" width="340" height="290" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="215" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">波形整形与回差对比</text>
  <text x="215" y="145" text-anchor="middle" font-size="12" fill="#334155">74LS14：VT+ ≈ 1.7 V, VT- ≈ 0.9 V (ΔVT ≈ 0.8 V)</text>
  <text x="215" y="180" text-anchor="middle" font-size="12" fill="#334155">CD40106：VT+ ≈ 3.0 V, VT- ≈ 2.0 V (ΔVT ≈ 1.0 V)</text>
  <text x="215" y="220" text-anchor="middle" font-size="11" fill="#1d4ed8">信号源 1 kHz 正弦波 → S14_IN / S106_IN → 方波</text>
  <rect x="435" y="75" width="340" height="290" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="605" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CD40106 单门 RC 多谐振荡器</text>
  <text x="605" y="145" text-anchor="middle" font-size="12" fill="#334155">反馈连线：S106_OUT → OSC_R</text>
  <text x="605" y="180" text-anchor="middle" font-size="12" fill="#334155">电容节点：OSC_C (100 nF) → S106_IN</text>
  <text x="605" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Rf=4.7kΩ → f≈2.37 kHz；10kΩ → 1.15 kHz</text>
  <circle cx="95" cy="310" r="4" fill="#2563eb" data-jack="pls1.S14_IN"/>
  <circle cx="335" cy="310" r="4" fill="#2563eb" data-jack="pls1.S14_OUT"/>
  <circle cx="485" cy="310" r="4" fill="#16a34a" data-jack="pls1.S106_IN"/>
  <circle cx="605" cy="310" r="4" fill="#16a34a" data-jack="pls1.OSC_R"/>
  <circle cx="725" cy="310" r="4" fill="#16a34a" data-jack="pls1.S106_OUT"/>
  <text x="410" y="405" text-anchor="middle" font-size="12" fill="#64748b">阶段 1 接信号源 CH1 测整形/回差；阶段 2 拆信号源并连 S106_OUT→OSC_R、OSC_C→S106_IN 起振</text>
</svg>
