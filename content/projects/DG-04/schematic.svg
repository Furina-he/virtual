<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="title desc">
  <title id="title">DG-04 电位与电压测定双电源网络原理图</title>
  <desc id="desc">mod-dc-circuit 上半部 F、A、B、C、D、E 六节点双电源网络，分别以 D 与 E 作为零电位参考点测定各点电位并绘制电路电位图。</desc>
  <style>
    text { font-family: "Noto Sans SC Variable", sans-serif; fill: #18181b; font-size: 15px; }
    .wire { fill: none; stroke: #18181b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke: #18181b; stroke-width: 2; }
    .jack { fill: #ffffff; stroke: #18181b; stroke-width: 2; cursor: pointer; }
    .ref { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 5 4; }
    .small { font-size: 13px; fill: #52525b; }
    .center { text-anchor: middle; }
  </style>
  <rect width="820" height="480" fill="#ffffff"/>
  <text x="410" y="34" class="center" style="font-size: 20px; font-weight: 600">DG-04 双电源直流网络电位测定与参考点切换</text>
  <text x="410" y="58" class="center small">mod-dc-circuit 上半部 · K1=1, K2=1, K3=0 (R5) · CH1=6 V, CH2=12 V</text>

  <g class="wire">
    <path d="M130 140 H220 M290 140 H410 H520 M590 140 H690"/>
    <path d="M410 140 V210 M410 280 V340"/>
    <path d="M130 340 H230 M300 340 H410 H515 M585 340 H690"/>
    <path d="M130 140 V212 M130 268 V340"/>
    <path d="M690 140 V212 M690 268 V340"/>
  </g>

  <rect x="220" y="130" width="70" height="20" class="box"/>
  <rect x="520" y="130" width="70" height="20" class="box"/>
  <rect x="400" y="210" width="20" height="70" class="box"/>
  <rect x="230" y="330" width="70" height="20" class="box"/>
  <rect x="515" y="330" width="70" height="20" class="box"/>
  <circle cx="130" cy="240" r="28" class="box"/>
  <circle cx="690" cy="240" r="28" class="box"/>

  <text x="255" y="118" class="center">R1 510Ω</text>
  <text x="555" y="118" class="center">R2 1kΩ</text>
  <text x="456" y="248" class="center">R3 510Ω</text>
  <text x="265" y="372" class="center">R4 510Ω</text>
  <text x="550" y="372" class="center">R5 330Ω</text>
  <text x="130" y="234" class="center">+</text>
  <text x="130" y="258" class="center">−</text>
  <text x="690" y="234" class="center">+</text>
  <text x="690" y="258" class="center">−</text>
  <text x="72" y="236" class="center">CH1</text>
  <text x="72" y="256" class="center small">6 V</text>
  <text x="748" y="236" class="center">CH2</text>
  <text x="748" y="256" class="center small">12 V</text>

  <!-- 参考地标注（D / E 两种选择） -->
  <path d="M410 340 V385 M396 385 H424 M401 392 H419 M406 399 H414" class="ref"/>
  <text x="410" y="418" class="center small" style="fill: #2563eb">参考点 1：D（0 V）</text>
  <path d="M130 340 V385 M116 385 H144 M121 392 H139 M126 399 H134" class="ref"/>
  <text x="130" y="418" class="center small" style="fill: #2563eb">参考点 2：E（0 V）</text>

  <circle id="JACK_KH_U1P" data-jack="dc1.KH_U1P" cx="130" cy="185" r="4.5" class="jack"/>
  <circle id="JACK_KH_U1N" data-jack="dc1.KH_U1N" cx="130" cy="295" r="4.5" class="jack"/>
  <circle id="JACK_KH_U2P" data-jack="dc1.KH_U2P" cx="690" cy="185" r="4.5" class="jack"/>
  <circle id="JACK_KH_U2N" data-jack="dc1.KH_U2N" cx="690" cy="295" r="4.5" class="jack"/>
  <circle id="JACK_KH_F" data-jack="dc1.KH_F" cx="130" cy="140" r="5" class="jack"/>
  <circle id="JACK_KH_A" data-jack="dc1.KH_A" cx="410" cy="140" r="5" class="jack"/>
  <circle id="JACK_KH_B" data-jack="dc1.KH_B" cx="690" cy="140" r="5" class="jack"/>
  <circle id="JACK_KH_E" data-jack="dc1.KH_E" cx="130" cy="340" r="5" class="jack"/>
  <circle id="JACK_KH_D" data-jack="dc1.KH_D" cx="410" cy="340" r="5" class="jack"/>
  <circle id="JACK_KH_C" data-jack="dc1.KH_C" cx="690" cy="340" r="5" class="jack"/>

  <text x="130" y="122" class="center" style="font-weight: 600">F (1)</text>
  <text x="410" y="122" class="center" style="font-weight: 600">A (2)</text>
  <text x="690" y="122" class="center" style="font-weight: 600">B (3)</text>
  <text x="108" y="346" class="small" style="font-weight: 600">E (6)</text>
  <text x="430" y="360" class="small" style="font-weight: 600">D (5)</text>
  <text x="712" y="346" class="small" style="font-weight: 600">C (4)</text>

  <text x="410" y="454" class="center small">电压表负端接参考点（D 或 E），正端依次点测其余 5 个节点；本项目自绘离线原理图</text>
</svg>
