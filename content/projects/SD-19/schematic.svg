<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440">
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">SD-19 4 位环形与扭环形计数节拍发生器原理图（74LS194 / 74LS175）</text>
  <rect x="40" y="65" width="350" height="305" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="215" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">自启动四拍环形计数器（74LS194）</text>
  <text x="215" y="130" text-anchor="middle" font-size="12" fill="#334155">S1=0, S0=1 (右移), /CLR=+5V</text>
  <text x="215" y="165" text-anchor="middle" font-size="12" fill="#334155">自启动反馈：R194_FB = ~(QA | QB | QC) → SR</text>
  <text x="215" y="205" text-anchor="middle" font-size="12" fill="#1d4ed8">1000 → 0100 → 0010 → 0001 → 1000</text>
  <text x="215" y="242" text-anchor="middle" font-size="11" fill="#475569">4 拍独热节拍，f_T = f_CLK / 4，占空比 25%</text>
  <rect x="430" y="65" width="350" height="305" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="605" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">四位扭环形（约翰逊）计数器（74LS175）</text>
  <text x="605" y="130" text-anchor="middle" font-size="12" fill="#334155">D2=Q1, D3=Q2, D4=Q3 内部级联，/CLR=+5V</text>
  <text x="605" y="165" text-anchor="middle" font-size="12" fill="#334155">扭环反馈：R175_NQ4 → R175_D1</text>
  <text x="605" y="205" text-anchor="middle" font-size="12" fill="#15803d">0000→1000→1100→1110→1111→0111→0011→0001</text>
  <text x="605" y="242" text-anchor="middle" font-size="11" fill="#475569">8 状态循环，f_J = f_CLK / 8，占空比 50%</text>
  <circle cx="95" cy="310" r="4" fill="#2563eb" data-jack="rng1.R194_FB"/>
  <circle cx="215" cy="310" r="4" fill="#2563eb" data-jack="rng1.R194_SR"/>
  <circle cx="335" cy="310" r="4" fill="#2563eb" data-jack="rng1.R194_QA"/>
  <circle cx="490" cy="310" r="4" fill="#16a34a" data-jack="rng1.R175_NQ4"/>
  <circle cx="605" cy="310" r="4" fill="#16a34a" data-jack="rng1.R175_D1"/>
  <circle cx="720" cy="310" r="4" fill="#16a34a" data-jack="rng1.R175_Q1"/>
  <text x="410" y="408" text-anchor="middle" font-size="12" fill="#64748b">CLK_OUT 接 R194_CP 或 R175_CP；示波器观测四分频与八分频节拍波形</text>
</svg>
